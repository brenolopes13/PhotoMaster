[package]
name = "photomaster-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
rayon = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
roxmltree = "0.20"
percent-encoding = "2"
kamadak-exif = "0.5"
img-parts = "0.3"
getrandom = "0.2"
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
