name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: photomaster-linux-x86_64
            bin: target/release/photomaster
          - os: windows-latest
            artifact: photomaster-windows-x86_64
            bin: target/release/photomaster.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p photomaster
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
